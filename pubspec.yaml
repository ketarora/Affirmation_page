name: nishaffs
description: "NishAffs ✨ — India's Cutest Affirmation App — Full Working v4"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  smooth_page_indicator: ^1.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  # Audio Playback
  just_audio: ^0.9.39
  audio_session: ^0.1.18
  # Image Picker
  image_picker: ^1.1.2
  # Path Provider for file storage
  path_provider: ^2.1.4
  # Firebase Backend
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.1.0
  syncfusion_flutter_pdfviewer: ^33.2.12
  share_plus: ^7.2.2
  screenshot: ^2.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/books/
