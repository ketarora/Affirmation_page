name: nishaffs
description: "NishAffs ✨ — India's Cutest Affirmation App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── UI & Fonts ──────────────────────────────────────────────────
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0
  cached_network_image: ^3.3.1

  # ── State & Navigation ──────────────────────────────────────────
  shared_preferences: ^2.2.2
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3

  # ── Audio ───────────────────────────────────────────────────────
  just_audio: ^0.9.39
  audio_session: ^0.1.18

  # ── Media & Files ───────────────────────────────────────────────
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  share_plus: ^7.2.2
  screenshot: ^3.0.0

  # ── PDF ─────────────────────────────────────────────────────────
  syncfusion_flutter_pdfviewer: ^33.2.12
  syncfusion_flutter_signaturepad: ^33.2.12

  # ── Notifications (mobile only — guarded with kIsWeb in code) ──
  flutter_local_notifications: ^18.0.0  # ← WAS MISSING from pubspec!
  timezone: ^0.9.4                       # ← WAS MISSING from pubspec!

  # ── Firebase ────────────────────────────────────────────────────
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0

  # ── Auth Providers ──────────────────────────────────────────────
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^8.1.0

  # ── Utilities ───────────────────────────────────────────────────
  timeago: ^3.3.0              # ← WAS MISSING — used in community_screen.dart
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/books/
    - assets/audio/
